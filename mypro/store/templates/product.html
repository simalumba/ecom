{% extends 'base.html' %}
{% block content %}



<div class="container">
<br/>

        
 <div class="card mb-3">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <center>
        <h5 class="card-title">{{ product.name }}</h5>
        <br/>
        <p class="card-text justified">{{ product.description }}</p>
       {% if product.is_sale %}
       <div class="bi-star-fill"></div> &nbsp;&nbsp;Sale!&nbsp;&nbsp; <div class="bi-star-fill"></div>
       <s>K{{ product.price }}</s> &nbsp; K{{ product.sale_price }}
        {% else %}
        K{{ product.price }}
        
        {% endif %}
        <br/><br/>
        <div class="row justify-content-center">
           <div class="col-md-2">Quantity:</div>
           <div class="col-mb-2">
         <select class="form-select form-select-sm
         " id="qty-cart">
         <option value="1">1</option>
         <option value="2">2</option>
         <option value="3">3</option>
         <option value="4">4</option>
         <option value="5">5</option>
       </select>
        </div>
      </div>
        <br/><br/>
        <a href="{% url 'store:home'%}" class="btn btn-secondary
        ">Back</a>
         <button type="button" value="{{ product.id }}" 
          class="btn btn-secondary" id="add-cart">Add To Cart</
          button>
        </center>
      </div>
    </div>
  </div>
</div>
</div>                   


<br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br
/><br/><br/><br/><br/><br/><br/><br/><br/>

<script>
// check if button pressed 
$(document).on('click','#add-cart',function(e){
    e.preventDefault();
    $.ajax({
        type: 'POST',
        url: '/cart/add/',
        data: {
            'product_id': $(this).val(),
            'product_qty': $('#qty-cart').val(),
            'csrfmiddlewaretoken': '{{ csrf_token }}',
            'action': 'post'
        },
        success: function(json){
            document.getElementById("cart_quantity").textContent = json.qty
        },
        error: function(xhr, errmsg, err){
            console.log(err)
        }
    });
})  
</script> 
{% endblock %}
